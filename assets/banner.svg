<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="1200" height="400" role="img" aria-label="de-slop — Eliminate AI Slop. Enforce Senior Craft. Craft Score 100 / 100 — Principal Craft">
  <defs>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#18181b" stroke-width="1"/>
    </pattern>
    <linearGradient id="surfaceFade" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#111113"/>
      <stop offset="100%" stop-color="#09090b"/>
    </linearGradient>
    <clipPath id="outerClip">
      <rect width="1200" height="400" rx="16"/>
    </clipPath>
  </defs>

  <g clip-path="url(#outerClip)">
    <!-- Neutral dark canvas -->
    <rect width="1200" height="400" fill="url(#surfaceFade)"/>
    <rect width="1200" height="400" fill="url(#grid)" opacity="0.65"/>

    <!-- Subtle top hairline highlight -->
    <line x1="0" y1="1" x2="1200" y2="1" stroke="#27272a" stroke-width="1"/>

    <!-- Left column: Brand & Tagline -->
    <g transform="translate(64, 72)">
      <!-- Eyebrow pill -->
      <rect x="0" y="0" width="188" height="28" rx="6" fill="#18181b" stroke="#27272a" stroke-width="1"/>
      <circle cx="16" cy="14" r="3.5" fill="#22c55e"/>
      <text x="29" y="18.5" fill="#a1a1aa" font-family="'JetBrains Mono', 'SFMono-Regular', Consolas, monospace" font-size="11.5" font-weight="500" letter-spacing="1.2">HYBRID CLI + AI RULES</text>

      <!-- Brand mark -->
      <text x="0" y="114" fill="#fafafa" font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="76" font-weight="700" letter-spacing="-3">de-slop</text>
      <rect x="278" y="102" width="14" height="14" rx="2" fill="#22c55e"/>

      <!-- Tagline -->
      <text x="2" y="160" fill="#d4d4d8" font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="22" font-weight="500" letter-spacing="-0.3">Eliminate AI Slop. Enforce Senior Craft.</text>

      <!-- Divider -->
      <line x1="2" y1="194" x2="430" y2="194" stroke="#27272a" stroke-width="1"/>

      <!-- Ecosystem strip -->
      <text x="2" y="226" fill="#71717a" font-family="'JetBrains Mono', 'SFMono-Regular', Consolas, monospace" font-size="13" letter-spacing="0.2">Cursor  ·  Claude Code  ·  Antigravity  ·  Gemini</text>
      <text x="2" y="250" fill="#52525b" font-family="'JetBrains Mono', 'SFMono-Regular', Consolas, monospace" font-size="12.5">$ npx de-slop init --all &amp;&amp; npx de-slop scan</text>
    </g>

    <!-- Right column: Terminal Craft Score Card -->
    <g transform="translate(620, 62)">
      <!-- Card container -->
      <rect x="0" y="0" width="516" height="276" rx="12" fill="#0d0d10" stroke="#27272a" stroke-width="1"/>

      <!-- Terminal title bar -->
      <path d="M 1 12 Q 1 1 12 1 L 504 1 Q 515 1 515 12 L 515 38 L 1 38 Z" fill="#141418"/>
      <line x1="0" y1="38" x2="516" y2="38" stroke="#27272a" stroke-width="1"/>

      <!-- Minimal monochrome window dots -->
      <circle cx="22" cy="19.5" r="4.5" fill="#3f3f46"/>
      <circle cx="38" cy="19.5" r="4.5" fill="#3f3f46"/>
      <circle cx="54" cy="19.5" r="4.5" fill="#3f3f46"/>
      <text x="496" y="23.5" text-anchor="end" fill="#71717a" font-family="'JetBrains Mono', 'SFMono-Regular', Consolas, monospace" font-size="11.5">de-slop v1.0.0</text>

      <!-- Command prompt -->
      <text x="24" y="72" fill="#71717a" font-family="'JetBrains Mono', 'SFMono-Regular', Consolas, monospace" font-size="13.5">$</text>
      <text x="42" y="72" fill="#e4e4e7" font-family="'JetBrains Mono', 'SFMono-Regular', Consolas, monospace" font-size="13.5">npx de-slop scan src templates README.md</text>

      <!-- Audit status lines -->
      <rect x="24" y="92" width="28" height="19" rx="4" fill="#052e16" stroke="#166534" stroke-width="1"/>
      <text x="38" y="105" text-anchor="middle" fill="#4ade80" font-family="'JetBrains Mono', 'SFMono-Regular', Consolas, monospace" font-size="10.5" font-weight="700">OK</text>
      <text x="62" y="105.5" fill="#d4d4d8" font-family="'JetBrains Mono', 'SFMono-Regular', Consolas, monospace" font-size="13">No AI slop patterns found across 14 files.</text>

      <text x="24" y="133" fill="#71717a" font-family="'JetBrains Mono', 'SFMono-Regular', Consolas, monospace" font-size="12">0 COPY  ·  0 UI  ·  0 CODE  ·  --min-score 95 passed</text>

      <!-- Hairline separator -->
      <line x1="24" y1="156" x2="492" y2="156" stroke="#27272a" stroke-width="1"/>

      <!-- Craft Score Header -->
      <text x="24" y="185" fill="#a1a1aa" font-family="'JetBrains Mono', 'SFMono-Regular', Consolas, monospace" font-size="11.5" font-weight="600" letter-spacing="1.2">CRAFT SCORE</text>

      <!-- Principal Craft Badge -->
      <rect x="248" y="167" width="244" height="26" rx="6" fill="#052e16" stroke="#166534" stroke-width="1"/>
      <circle cx="264" cy="180" r="3.5" fill="#22c55e"/>
      <text x="276" y="184.5" fill="#4ade80" font-family="'JetBrains Mono', 'SFMono-Regular', Consolas, monospace" font-size="12" font-weight="600">100 / 100 — Principal Craft</text>

      <!-- Crisp 20-segment progress bar -->
      <g transform="translate(24, 210)">
        <rect x="0" y="0" width="468" height="14" rx="4" fill="#18181b" stroke="#27272a" stroke-width="1"/>
        <rect x="2" y="2" width="464" height="10" rx="2.5" fill="#22c55e"/>
      </g>

      <!-- Footer metadata -->
      <text x="24" y="252" fill="#71717a" font-family="'JetBrains Mono', 'SFMono-Regular', Consolas, monospace" font-size="11.5">UI · Copy · Motion · Senior Code</text>
      <text x="492" y="252" text-anchor="end" fill="#52525b" font-family="'JetBrains Mono', 'SFMono-Regular', Consolas, monospace" font-size="11.5">exit 0</text>
    </g>

    <!-- Outer crisp 1px border -->
    <rect x="0.5" y="0.5" width="1199" height="399" rx="15.5" fill="none" stroke="#27272a" stroke-width="1"/>
  </g>
</svg>
